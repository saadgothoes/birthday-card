name: Build and Deploy

on:
  push:
    branches: [main]

# Ek waqt mein sirf ek deploy chale. Agar pichla abhi chal raha ho to naya
# uska intezar karega — do deploy ek saath server par nahi tikrayenge.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Pehle code aur PHP packages. Build files abhi nahi bhejni, kyunki
      # git pull unhe hata sakta hai.
      - name: Pull code and install PHP packages
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd ~/birthday_card_app
            git pull origin main
            COMPOSER_MEMORY_LIMIT=-1 php composer.phar install \
              --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force

      # Ab taaza build files. Ye git pull ke BAAD ja rahi hain, is liye
      # inhe koi cheez overwrite nahi karegi.
      - name: Upload build files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build/*"
          target: "/home/clinic/birthday_card_app/public/build"
          strip_components: 2

      # Sab kuch apni jagah aa gaya — ab purani cache hatao aur app restart karo.
      # clear pehle, cache baad mein: warna Laravel purani copy hi pakre rehta hai.
      - name: Clear caches and restart app
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd ~/birthday_card_app
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            mkdir -p tmp
            touch tmp/restart.txt
